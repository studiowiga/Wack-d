name: Build Wackd VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Wackd-VST3-Windows
          path: build/Wackd_artefacts/Release/VST3/

  macos:
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and zip
        run: |
          codesign --force --deep -s - build/Wackd_artefacts/Release/VST3/Wackd.vst3
          cd build/Wackd_artefacts/Release/VST3
          ditto -c -k --keepParent Wackd.vst3 Wackd-VST3-macOS.zip

      - name: Upload VST3 (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Wackd-VST3-macOS
          path: build/Wackd_artefacts/Release/VST3/Wackd-VST3-macOS.zip
